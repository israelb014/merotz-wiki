name: Release apps (Android, Windows, Linux)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build, e.g. v1.0.0'
        required: true

permissions:
  contents: write
  actions: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # manual run: create the tag on the dispatched commit if it does not exist yet (GITHUB_TOKEN pushes don't re-trigger)
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then echo "tag $TAG exists"; exit 0; fi
          git config user.name "merotz-wiki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "מרוץ ויקי $TAG"
          git push origin "refs/tags/$TAG"

  tests:
    needs: tag
    uses: ./.github/workflows/tests.yml

  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - run: npm ci
      - run: npx cap sync android
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Android unit tests (crash reporter logic)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace
      - name: Build signed APK
        working-directory: android
        env:
          APP_VERSION: ${{ env.TAG }}
          MW_KEYSTORE: ${{ runner.temp }}/release.jks
          MW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/merotz-wiki.apk
      - name: Verify signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs out/merotz-wiki.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/merotz-wiki.apk

  linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set version
        working-directory: desktop
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
        working-directory: desktop
      - name: Crash reporting config (single source)
        shell: bash
        run: cp config/crash-reporting.json desktop/crash-reporting.json
      - run: npx electron-builder --linux deb AppImage --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/dist/merotz-wiki.deb
            desktop/dist/merotz-wiki.AppImage
            desktop/dist/latest-linux.yml

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set version
        working-directory: desktop
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
        working-directory: desktop
      - name: Crash reporting config (single source)
        shell: bash
        run: cp config/crash-reporting.json desktop/crash-reporting.json
      - run: npx electron-builder --win nsis --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/merotz-wiki-setup.exe
            desktop/dist/merotz-wiki-setup.exe.blockmap
            desktop/dist/latest.yml

  release:
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from changelog
        run: |
          node -e '
            const cl = require("./public/data/changelog.json");
            const v = process.env.TAG.replace(/^v/, "");
            const e = cl.find((x) => x.version === v) || cl[0];
            const lines = [`## ${e.title || "מרוץ ויקי " + v}`, "", ...e.items.map((i) => "- " + i), "",
              "**הורדה:** https://israelb014.github.io/merotz-wiki/download/", "",
              "| פלטפורמה | קובץ |", "|---|---|",
              "| Android | merotz-wiki.apk |", "| Windows | merotz-wiki-setup.exe |", "| Linux (Debian/Ubuntu) | merotz-wiki.deb |", "| Linux (כל הפצה) | merotz-wiki.AppImage |"];
            require("fs").writeFileSync("notes.md", lines.join("\n"));
          '
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: מרוץ ויקי ${{ env.TAG }}
          body_path: notes.md
          make_latest: true
          files: artifacts/*
      - name: Redeploy site (updates version.json for app update checks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
