name: Daily challenge (next 14 days)

on:
  schedule:
    # 00:30 Israel time = 21:30 UTC (IDT, summer) / 22:30 UTC (IST, winter). GitHub may delay scheduled runs by hours,
    # so both run and the generator is idempotent: it only fills missing days (14 ahead) and never changes existing ones.
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate daily.json
        run: node scripts/gen-daily.mjs --days 14
      - name: Commit & redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/daily.json; then echo "No changes"; exit 0; fi
          git config user.name "merotz-wiki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/daily.json
          git commit -m "Daily challenges: $(TZ=Asia/Jerusalem date +%F)"
          git push
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
